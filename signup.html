<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - MaestroDigitLab</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-orange: #FF7A59;
            --primary-brown: #8B4513;
            --dark-brown: #5D4037;
            --light-orange: #FFE0B2;
            --dark-orange: #E64A19;
            --cream: #FBE9E7;
            --white: #FFFFFF;
            --black: #333333;
            --gradient-orange: linear-gradient(135deg, var(--primary-orange) 0%, var(--dark-orange) 100%);
            --gradient-brown: linear-gradient(135deg, var(--primary-brown) 0%, var(--dark-brown) 100%);
            --shadow: 0 5px 15px rgba(139, 69, 19, 0.2);
            --shadow-hover: 0 10px 25px rgba(139, 69, 19, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--cream);
            color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .signup-container {
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .signup-header {
            background: var(--gradient-brown);
            padding: 30px;
            text-align: center;
            color: var(--white);
        }

        .signup-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .signup-header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        .signup-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark-brown);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 2px rgba(255, 122, 89, 0.2);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .terms input {
            margin-right: 10px;
            margin-top: 5px;
        }

        .terms label {
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .terms a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 500;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        .signup-button {
            background: var(--gradient-orange);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .signup-button:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link p {
            color: var(--black);
        }

        .login-link a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: var(--dark-orange);
            text-decoration: underline;
        }

        @media (max-width: 580px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        @media (max-width: 480px) {
            .signup-container {
                border-radius: 10px;
            }
            
            .signup-header {
                padding: 20px;
            }
            
            .signup-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <h1>Inscription</h1>
            <p>Rejoignez la communauté MaestroDigitLab</p>
        </div>
        
        <form class="signup-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">Prénom</label>
                    <input type="text" id="firstName" placeholder="Votre prénom" required>
                </div>
                
                <div class="form-group">
                    <label for="lastName">Nom</label>
                    <input type="text" id="lastName" placeholder="Votre nom" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" placeholder="Choisissez un nom d'utilisateur" required>
            </div>
            
            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" placeholder="Votre adresse e-mail" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Numéro de téléphone</label>
                <input type="tel" id="phone" placeholder="Votre numéro de téléphone" required>
            </div>
            
            <div class="form-group">
                <label for="country">Pays</label>
                <select id="country" required>
                    <option value="" disabled selected>Sélectionnez votre pays</option>
                    <option value="cm">Cameroun</option>
                    <option value="fr">France</option>
                    <option value="be">Belgique</option>
                    <option value="ch">Suisse</option>
                    <option value="ca">Canada</option>
                    <option value="other">Autre</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="Créez un mot de passe" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirmation</label>
                    <input type="password" id="confirmPassword" placeholder="Confirmez le mot de passe" required>
                </div>
            </div>
            
            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">J'accepte les <a href="#">Conditions d'utilisation</a> et la <a href="#">Politique de confidentialité</a> de MaestroDigitLab</label>
            </div>
            
            <button type="submit" class="signup-button">Créer un compte</button>
            
            <div class="login-link">
                <p>Vous avez déjà un compte? <a href="login.html">Se connecter</a></p>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const signupForm = document.querySelector('.signup-form');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            
            // Fonction pour valider que les mots de passe correspondent
            function validatePassword() {
                if (passwordInput.value !== confirmPasswordInput.value) {
                    confirmPasswordInput.setCustomValidity("Les mots de passe ne correspondent pas");
                } else {
                    confirmPasswordInput.setCustomValidity("");
                }
            }
            
            passwordInput.addEventListener('change', validatePassword);
            confirmPasswordInput.addEventListener('keyup', validatePassword);
            
            signupForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Validation des mots de passe
                validatePassword();
                
                if (signupForm.checkValidity()) {
                    // Simulation d'inscription réussie
                    alert('Inscription réussie! Vous allez être redirigé vers la page de connexion.');
                    window.location.href = 'login.html';
                }
            });
        });
    </script>
</body>
</html>
