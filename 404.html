<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page en construction - Social Booost Horizon</title>
    <style>
        /* Styles de base et reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 1s ease-out;
            z-index: 1;
            position: relative;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        p {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .team-name {
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 0 10px rgba(255, 235, 59, 0.5);
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin: 2.5rem 0;
        }

        .countdown-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 1.5rem 1rem;
            border-radius: 15px;
            min-width: 100px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }

        .countdown-item:hover {
            transform: translateY(-10px);
        }

        .countdown-number {
            font-size: 3rem;
            font-weight: 800;
            display: block;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .countdown-label {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.5rem;
            display: block;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(45deg, #FF3366, #FF6633);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
        }

        .btn:hover::after {
            transform: translateX(100%);
            transition: transform 0.6s ease;
        }

        .illustration {
            max-width: 300px;
            margin: 0 auto 2rem;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: floatBubble 20s infinite linear;
            z-index: 0;
        }

        @keyframes floatBubble {
            0% { transform: translateY(100vh) scale(0); }
            100% { transform: translateY(-100vh) scale(1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .countdown {
                gap: 0.8rem;
            }
            
            .countdown-item {
                min-width: 70px;
                padding: 1rem 0.5rem;
            }
            
            .countdown-number {
                font-size: 2rem;
            }
            
            .countdown-label {
                font-size: 0.8rem;
            }
            
            .illustration {
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- Bulles décoratives animées -->
    <div class="bubble" style="width: 80px; height: 80px; left: 10%; animation-delay: 0s;"></div>
    <div class="bubble" style="width: 120px; height: 120px; left: 20%; animation-delay: -2s;"></div>
    <div class="bubble" style="width: 60px; height: 60px; left: 50%; animation-delay: -5s;"></div>
    <div class="bubble" style="width: 100px; height: 100px; left: 80%; animation-delay: -8s;"></div>
    <div class="bubble" style="width: 70px; height: 70px; left: 40%; animation-delay: -12s;"></div>

    <div class="container">
        <!-- Illustration -->
        <svg class="illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Fond -->
            <circle cx="100" cy="100" r="90" fill="#4FC3F7" opacity="0.3"/>
            
            <!-- Engrenage 1 -->
            <g transform="translate(60, 60)">
                <path d="M30,0 L35,15 L50,15 L40,25 L45,40 L30,35 L15,40 L20,25 L10,15 L25,15 Z" fill="#FFEB3B" opacity="0.9">
                    <animateTransform attributeName="transform" type="rotate" from="0 30 30" to="360 30 30" dur="10s" repeatCount="indefinite"/>
                </path>
            </g>
            
            <!-- Engrenage 2 -->
            <g transform="translate(140, 120)">
                <path d="M25,0 L30,12 L42,12 L33,20 L38,32 L25,28 L12,32 L17,20 L8,12 L20,12 Z" fill="#E91E63" opacity="0.9">
                    <animateTransform attributeName="transform" type="rotate" from="360 25 25" to="0 25 25" dur="8s" repeatCount="indefinite"/>
                </path>
            </g>
            
            <!-- Outil -->
            <g transform="translate(100, 80)">
                <rect x="-5" y="-30" width="10" height="40" fill="#795548"/>
                <rect x="-15" y="-40" width="30" height="10" fill="#795548"/>
                <circle cx="0" cy="15" r="10" fill="#9E9E9E"/>
                <animateTransform attributeName="transform" type="translate" values="0,0; 0,5; 0,0" dur="3s" repeatCount="indefinite"/>
            </g>
        </svg>

        <h1>Oups !</h1>
        <p>Cette page est en cours de construction par l'équipe <span class="team-name">Social Booost Horizon</span>.</p>
        <p>Nous travaillons dur pour vous offrir une expérience exceptionnelle. Revenez très vite !</p>

        <!-- Compte à rebours -->
        <div class="countdown">
            <div class="countdown-item">
                <span id="days" class="countdown-number">00</span>
                <span class="countdown-label">Jours</span>
            </div>
            <div class="countdown-item">
                <span id="hours" class="countdown-number">00</span>
                <span class="countdown-label">Heures</span>
            </div>
            <div class="countdown-item">
                <span id="minutes" class="countdown-number">00</span>
                <span class="countdown-label">Minutes</span>
            </div>
            <div class="countdown-item">
                <span id="seconds" class="countdown-number">00</span>
                <span class="countdown-label">Secondes</span>
            </div>
        </div>

        <!-- Boutons avec les NOUVEAUX liens -->
        <a href="https://social-boost-horizon-new-sbh.vercel.app/" class="btn">Social Boost Horizon</a>
        <a href="dashboard.html" class="btn">Revenir au tableau de bord</a>
    </div>

    <script>
        // Compte à rebours - réglé sur 7 jours à partir de maintenant
        let countdownDate = new Date();
        countdownDate.setDate(countdownDate.getDate() + 7);
        countdownDate.setHours(12, 0, 0, 0);

        function updateCountdown() {
            let now = new Date().getTime();
            let distance = countdownDate - now;

            if (distance < 0) {
                clearInterval(countdownTimer);
                document.getElementById("days").innerHTML = "00";
                document.getElementById("hours").innerHTML = "00";
                document.getElementById("minutes").innerHTML = "00";
                document.getElementById("seconds").innerHTML = "00";
                return;
            }

            let days = Math.floor(distance / (1000 * 60 * 60 * 24));
            let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            let seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Formatage avec zéros non significatifs
            days = days < 10 ? "0" + days : days;
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            // Animation de rebondissement à chaque changement de seconde
            if (seconds !== updateCountdown.lastSeconds) {
                animateCountdown();
                updateCountdown.lastSeconds = seconds;
            }
        }

        function animateCountdown() {
            let countdownNumbers = document.querySelectorAll('.countdown-number');
            countdownNumbers.forEach(number => {
                number.classList.add('bounce');
                setTimeout(() => {
                    number.classList.remove('bounce');
                }, 500);
            });
        }

        // Ajout de l'animation de rebondissement
        let style = document.createElement('style');
        style.textContent = `
            .bounce {
                animation: bounce 0.5s ease;
            }
            @keyframes bounce {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.2); }
            }
        `;
        document.head.appendChild(style);

        // Mise à jour du compte à rebours toutes les secondes
        let countdownTimer = setInterval(updateCountdown, 1000);
        updateCountdown(); // Appel initial

        // Création de bulles supplémentaires de manière aléatoire
        function createBubbles() {
            const bubblesContainer = document.body;
            const bubbleCount = 15;
            
            for (let i = 0; i < bubbleCount; i++) {
                let bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                const size = Math.random() * 100 + 30;
                const left = Math.random() * 100;
                const delay = Math.random() * -20;
                const duration = Math.random() * 20 + 15;
                
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${left}%`;
                bubble.style.animationDelay = `${delay}s`;
                bubble.style.animationDuration = `${duration}s`;
                
                bubblesContainer.appendChild(bubble);
            }
        }

        createBubbles();
    </script>
</body>
</html>
